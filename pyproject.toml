[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlx-proxy"
version = "0.1.0"
description = "Lightweight OpenAI-compatible proxy with automatic sleep/wake lifecycle for mlx_lm.server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.111",
    "httpx>=0.27",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
mlx-proxy = "mlx_proxy.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["mlx_proxy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
