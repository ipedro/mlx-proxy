[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlx-proxy"
version = "0.1.0"
description = "Lightweight OpenAI-compatible proxy with automatic sleep/wake lifecycle for mlx_lm.server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.111",
    "httpx>=0.27",
    "uvicorn[standard]>=0.29",
]

[project.urls]
Homepage = "https://github.com/ipedro/mlx-proxy"
Repository = "https://github.com/ipedro/mlx-proxy"
Issues = "https://github.com/ipedro/mlx-proxy/issues"

[project.scripts]
mlx-proxy = "mlx_proxy.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["mlx_proxy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["mlx_proxy"]
